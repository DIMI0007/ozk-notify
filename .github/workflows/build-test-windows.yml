name: Build OZK Notify test DLL (Windows)
on:
  push:
    branches: [main, "codex/release-final", "codex/unify-header"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure OBS and plugin
        run: cmake --preset windows-ci-x64
      - name: Build Windows x64 DLL
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test thresholds and currency conversion
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Exercise and render Qt dock
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$PWD/build_x64/qtwebsockets-install/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot/plugins"
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config/normal"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config/narrow"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews/narrow 275 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config/wide"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews/wide 420 1050
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config/obs-dock"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews/obs-dock 360 620
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config/hidpi"
          $env:QT_SCALE_FACTOR = "2"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews/hidpi 360 620
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:QT_SCALE_FACTOR
      - uses: actions/upload-artifact@v4
        with:
          name: OZKNotify-UI-Previews
          path: ui-previews/
          if-no-files-found: error
      - name: Include original PNG preview diagnostics
        shell: pwsh
        run: |
          foreach ($item in Get-ChildItem -Path ui-previews -File -Recurse -Filter *.png | Where-Object { $_.Name -in @("01-home.png","08-countdown.png","16-monitoring-home.png","17-monitoring-bottom.png") -and $_.Directory.Name -in @("wide","obs-dock") }) {
            $encoded = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($item.FullName))
            Write-Output ("UI_PREVIEW_BEGIN:" + $item.FullName)
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 1000) {
              Write-Output ("UI_PREVIEW_DATA:" + $encoded.Substring($offset, [Math]::Min(1000, $encoded.Length - $offset)))
            }
            Write-Output "UI_PREVIEW_END"
          }
      - name: Stage plugin
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/TEST_WINDOWS_RU.md package/INSTALL_RU.md
          if (!(Test-Path package/stream-notify/bin/64bit/stream-notify.dll)) { throw "Plugin DLL missing" }
          if (!(Test-Path package/stream-notify/data/qt-plugins/tls/qschannelbackend.dll)) { throw "TLS backend missing" }
          $bin = 'package/stream-notify/bin/64bit'
          foreach ($file in Get-ChildItem $bin -File) { Move-Item -LiteralPath $file.FullName -Destination 'package/stream-notify' -Force }
          Remove-Item $bin
          Remove-Item 'package/stream-notify/bin'
          if (!(Test-Path package/stream-notify/stream-notify.dll)) { throw 'OBS 33 plugin layout missing' }
          if (Test-Path package/stream-notify/bin) { throw 'Legacy plugin layout remains' }
          Get-ChildItem package/stream-notify -Recurse -Filter *.dll | Get-FileHash | Format-Table -AutoSize | Out-File package/SHA256.txt
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $dlls = @(Get-ChildItem package/stream-notify -Recurse -Filter *.dll | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            [ordered]@{ file = $_.FullName.Substring((Resolve-Path package).Path.Length + 1); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash; signature = [string]$signature.Status }
          })
          [ordered]@{ product='OZK Notify'; version=$spec.version; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; obs='33.0.0'; qt='6.11.1'; packageType='unsigned-test-build'; files=$dlls } | ConvertTo-Json -Depth 5 | Set-Content package/BUILD_INFO.json -Encoding utf8
      - name: Verify packaged TLS and Telegram HTTPS without credentials
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$env:PATH"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          & ./build_x64/RelWithDebInfo/stream-notify-tls-test.exe "$PWD/package/stream-notify/data/qt-plugins"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OZKNotify-1.0.23-OBS33-Windows-x64
          path: package/
          if-no-files-found: error


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OZKNotify-UI-Diagnostics
          path: |
            ui-previews/**/*.png
            ui-previews/*.png
            build_x64/RelWithDebInfo/stream-notify-ui-preview.exe
          if-no-files-found: warn
